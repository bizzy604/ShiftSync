services:
  - type: web
    name: shiftsync-api
    runtime: python
    plan: free
    rootDir: .
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -r apps/api/requirements.txt
    startCommand: python scripts/alembic_migrate.py upgrade && python scripts/seed_production_once.py && uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: ENV_FILE
        value: .env.render
      - key: RUN_PROD_SEED_ON_DEPLOY
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: TOKEN_COOKIE_NAME
        value: shiftsync_token
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_URL
        value: https://shift-sync-web.vercel.app
      - key: FRONTEND_URLS
        value: https://shift-sync-web.vercel.app
      - key: DATABASE_URL
        value: postgresql://postgres.uxmrjrseeqsvhlaaajba:IawqBdd2eGFUl42y@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DIRECT_URL
        value: postgresql://postgres.uxmrjrseeqsvhlaaajba:IawqBdd2eGFUl42y@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: REDIS_URL
        sync: false
